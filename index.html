.layout{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(270px,.82fr);min-height:580px}.maincol{border-right:1px solid var(--line);padding:22px 24px 18px}.scenehead{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}.eyebrow{font:10px var(--pixel);color:var(--lime);letter-spacing:.15em;margin-bottom:6px}.scene-title{font-size:23px;line-height:1.05;font-weight:700;letter-spacing:-.04em}.scene-number{font:10px var(--pixel);color:#859692}.viewport{position:relative;background:#597b69;border:1px solid #5b7369;overflow:hidden;aspect-ratio:16/8.5;max-height:300px;min-height:190px}.viewport canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.scene-overlay{position:absolute;left:11px;top:10px;padding:5px 8px;background:#111b20d9;border:1px solid #ffffff20;font:9px var(--pixel);letter-spacing:.08em;color:#f6f2dd}.time-overlay{position:absolute;right:11px;top:10px;padding:5px 8px;background:#111b20d9;font:9px var(--pixel);color:var(--lime)}

:10px var(--pixel);color:var(--lime);margin-top:10px;min-height:13px}.side{padding:23px 20px;display:flex;flex-direction:column;gap:18px}.sidehead{display:flex;justify-content:space-between;align-items:center}.sidehead h2{font:10px var(--pixel);letter-spacing:.12em;font-weight:400;color:#d1dbd0;margin:0}.rank{color:var(--lime);font:9px var(--pixel)}.stats{display:grid;gap:13px}.statrow{display:grid;grid-template-columns:78px 1fr 25px;align-items:center;gap:8px;font:9px var(--pixel);letter-spacing:.04em;color:#bdc9be}.statbar{height:5px;background:#354448;overflow:hidden}.statfill{height:100%;background:var(--lime);transition:width .5s}.statrow:nth-child(2) .statfill{background:#82d8c3}.statrow:nth-child(3) .statfill{background:#ff986e}.statnum{text-align:right;color:#f3f0dd}.divider{height:1px;background:var(--line)}.timeline-title{font:9px var(--pixel);color:#9eafa6;letter-spacing:.13em;margin-bottom:9px}.timeline{display:grid;gap:9px}.timeline-item{display:flex;align-items:center;gap:9px;font-size:11px;color:#71827e}.timeline-item .dot{width:7px;height:7px;border:1px solid #72857d;transform:rotate(45deg)}.timeline-item.active{color:var(--cream)}.timeline-item.active .dot{background:var(--lime);border-color:var(--lime);box-shadow:0 0 8px #d8f36a60}.timeline-item.done{color:#9aafa0}.timeline-item.done .dot{background:#82d8c3;border-color:#82d8c3}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;justify-content:space-between}.utility{font:9px var(--pixel);color:#99aaa2;background:none;border:0;cursor:pointer;padding:7px 0}.utility:hover{color:var(--lime)}.hint{font:9px var(--pixel);color:#6f817d}.bottomline{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 19px;font:9px var(--pixel);color:#80918b;letter-spacing:.05em}.bottomline b{font-weight:400;color:#c0ccbf}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--lime);color:var(--ink);padding:9px 14px;font:10px var(--pixel);pointer-events:none;transition:.25s;z-index:5}.toast.show{transform:translate(-50%,0);opacity:1}.ending{text-align:center;padding:20px 0 4px}.ending h2{font-size:25px;margin:8px 0;color:var(--lime)}.ending p{max-width:500px;margin:0 auto 17px;color:#cad5c9;font-size:13px;line-height:1.6}.restart{border:1px solid var(--lime);background:var(--lime);color:var(--ink);font:10px var(--pixel);padding:12px 17px;cursor:pointer}.ending .score{font:10px var(--pixel);color:#a6b5aa;margin-bottom:15px}
@media(max-width:760px){body{padding:10px 10px calc(12px + env(safe-area-inset-bottom))}.topbar{margin-bottom:10px}.edition{font-size:8px}.game-head{height:43px;padding:0 12px;font-size:9px}.layout{grid-template-columns:1fr}.maincol{padding:15px 13px 15px;border-right:0}.side{padding:14px 14px 13px;gap:12px;border-top:1px solid var(--line)}.scene-title{font-size:20px}.viewport{aspect-ratio:16/8.5;min-height:160px}.dialogue{min-height:82px;margin-top:12px}.dialogue-text{font-size:13px}.choice{padding:11px 10px 11px 41px}.choice-hint{display:none}.choices{gap:7px}.stats{grid-template-columns:1fr 1fr;gap:10px 15px}.statrow{grid-template-columns:68px 1fr 21px;font-size:8px}.timeline{grid-template-columns:repeat(4,1fr);gap:8px 5px}.timeline-item{font-size:9px;gap:6px}.sidefoot{margin-top:0}.bottomline{padding:10px 12px;font-size:8px}.bottomline span:last-child{display:none}}
@media(max-width:370px){.brand-title{font-size:11px}.scene-title{font-size:18px}.timeline{grid-template-columns:repeat(2,1fr)}.head-right{gap:6px}}

<body>
<div class="app">
 <header class="topbar"><div class="brand"><div class="brandmark">CR7</div><div class="brand-title">RONALDO <span>:</span> EXTRA TIME</div></div><div class="edition">A CAREER IN PIXELS & POSSIBILITY</div></header>
 <main class="game">
  <div class="game-head"><div class="head-left"><span class="live-dot"></span><span id="season-label">CAREER MODE</span></div><div class="head-right"><span id="save-state">NEW SAVE</span><span>◆</span><span>PORTUGAL</span></div></div>
  <div class="layout">
   <section class="maincol">
    <div class="scenehead"><div><div class="eyebrow" id="scene-eyebrow">A STORY THAT'S YOURS</div><div class="scene-title" id="scene-title">One more chance.</div></div><div class="scene-number" id="scene-number">00 / 08</div></div>
    <div class="viewport"><canvas id="art" width="320" height="170" aria-label="Pixel art football scene"></canvas><div class="scene-overlay" id="location">FUNCHAL · PORTUGAL</div><div class="time-overlay" id="year">1997</div></div>
    <div id="content"></div>
   </section>
   <aside class="side">
    <div class="sidehead"><h2>PLAYER PROFILE</h2><span class="rank" id="rank">ROOKIE</span></div>
    <div class="stats" id="stats"></div>
    <div class="divider"></div>
    <div><div class="timeline-title">THE ROAD SO FAR</div><div class="timeline" id="timeline"></div></div>
    <div class="sidefoot"><button class="utility" id="sound-btn" aria-label="Toggle sound">♪ SOUND: OFF</button><button class="utility" id="reset-btn">↺ NEW CAREER</button></div>
   </aside>
  </div>
  <div class="bottomline"><span><b>↑ ↓</b> CHOOSE <b>· ENTER</b> CONFIRM <b>· SPACE</b> SHOOT</span><span>MADE FOR THE BEAUTIFUL GAME <b>✦</b></span></div>
 </main>
</div><div class="toast" id="toast">CAREER SAVED</div>
<script>
const chapters=[
 {place:'FUNCHAL · PORTUGAL',year:'1997',club:'MADEIRA',title:'The island boy',tag:'CHAPTER 01 · THE BEGINNING',speaker:'DOLORES',text:'The Atlantic wind rattles the windows. You are twelve, a ball at your feet, and a decision to make: leave Madeira for Lisbon, or keep the island close a little longer.',choices:[['Take the Sporting academy trial. The dream is bigger than home.','craft',5,'BOLD'],['Stay one more season. Family comes before the fast track.','loyalty',7,'ROOTED']]},
 {place:'ALCochete · LISBON',year:'2002',club:'SPORTING CP',title:'A new kind of player',tag:'CHAPTER 02 · THE ACADEMY',speaker:'YOUTH COACH',text:'At Sporting, your feet are quick and your stepovers quicker. The coaches want a team player. You want to be unforgettable. A visiting scout watches from the touchline.',choices:[['Work on the tricks after training. Let the football do the talking.','craft',8,'FOOTBALL FIRST'],['Ask for the number 7 shirt. Make them remember your name.','aura',7,'MAKE A STATEMENT']]},
 {place:'OLD TRAFFORD · MANCHESTER',year:'2003',club:'MANCHESTER UNITED',title:'The number seven',tag:'CHAPTER 03 · FIRST FLIGHT',speaker:'SIR ALEX',text:'A packed Old Trafford. Sir Alex has handed you the famous shirt. The crowd is waiting for a show; the veterans are waiting to see if you can deliver when it matters.',choices:[['Play the simple pass, then attack the space. Earn their trust.','craft',6,'TEAM FIRST'],['Take on the fullback. This is your moment to announce yourself.','aura',6,'FEARLESS']] ,match:true},
 {place:'MOSCOW · RUSSIA',year:'2008',club:'MANCHESTER UNITED',title:'Rain on the big night',tag:'CHAPTER 04 · THE FINAL',speaker:'RYAN GIGGS',text:'Champions League final. The pitch shines with rain. Teammates look to you, but the penalty spot feels a mile away. One kick can make a legend—or leave a scar.',choices:[['Ask to take the first penalty. Set the tone for everyone.','legacy',7,'LEAD THE WAY'],['Save your energy. Trust the captain and be ready for the rebound.','loyalty',5,'TRUST THE TEAM']] ,match:true},
 {place:'SANTIAGO BERNABÉU · MADRID',year:'2009',club:'REAL MADRID',title:'A galaxy of stars',tag:'CHAPTER 05 · THE NEW GALÁCTICO',speaker:'KARIM BENZEMA',text:'A new city, a world-record welcome, and a dressing room full of stars. Karim grins: “We can win everything. But who takes the last shot?” The Bernabéu holds its breath.',choices:[['Build a partnership. Greatness is even better shared.','loyalty',7,'PARTNERS IN CRIME'],['Demand the ball. You came here to be the difference.','aura',8,'THE MAIN MAN']]},
 {place:'LISBON · PORTUGAL',year:'2016',club:'PORTUGAL',title:'For the whole country',tag:'CHAPTER 06 · THE NATIONAL DREAM',speaker:'PEPE',text:'Your knee is hurt. The Euro final is slipping away. From the sideline, you can still lead Portugal—your voice, your belief, your teammates. The country is watching.',choices:[['Stay beside the team. Be their voice from the touchline.','loyalty',9,'CAPTAIN ALWAYS'],['Try to return. You refuse to leave this fight.','legacy',8,'NEVER GIVE IN']] ,match:true},
 {place:'CARDIFF · WALES',year:'2017',club:'REAL MADRID',title:'Three in a row?',tag:'CHAPTER 07 · A DYNASTY',speaker:'ZINÉDINE ZIDANE',text:'The final is level. Zidane catches your eye: one more burst, one more leap. Your body says slow down. Your ambition says the moment belongs to you.',choices:[['Trust your movement. Attack the space behind the defense.','craft',7,'THE PERFECT RUN'],['Call for the ball and take responsibility yourself.','legacy',8,'MAKE HISTORY']] ,match:true},
 {place:'RIYADH · SAUDI ARABIA',year:'2023',club:'AL NASSR',title:'The next chapter',tag:'CHAPTER 08 · WHAT COMES NEXT',speaker:'YOUNG FAN',text:'A new league, a new generation, a familiar number seven in the stands. A young fan asks what comes after breaking every record. The answer is yours to write.',choices:[['Build something lasting. Help the next generation rise.','loyalty',8,'PASS IT ON'],['One more record. One more impossible night.','legacy',9,'EXTRA TIME']]}
];
const labels={craft:'Technique',aura:'Stardom',loyalty:'Team spirit',legacy:'Legacy'};
const initial={chapter:0,phase:'intro',stats:{craft:28,aura:24,loyalty:35,legacy:18},goals:0,decisions:[],shot:0,shotGoals:0,saved:false};
let game=load();let sound=false;let selected=0;let needle=0,dir=1,anim=null;
const $=s=>document.querySelector(s);
function load(){try{const x=JSON.parse(localStorage.getItem('extra-time-save'));return x&&x.chapter!==undefined?x:structuredClone(initial)}catch{return structuredClone(initial)}}
function save(){game.saved=true;localStorage.setItem('extra-time-save',JSON.stringify(game));$('#save-state').textContent='AUTOSAVED';}
function clamp(n){return Math.max(0,Math.min(100,n))}
function render(){updateSide();const c=chapters[game.chapter];$('#season-label').textContent=game.phase==='ending'?'CAREER COMPLETE':`SEASON ${c?.year||'—'} · ${c?.club||'THE END'}`;$('#save-state').textContent=game.saved?'AUTOSAVED':'NEW SAVE';
 if(game.phase==='intro'){intro();drawScene(0);$('#scene-eyebrow').textContent='A STORY THAT’S YOURS';$('#scene-title').textContent='One more chance.';$('#scene-number').textContent='00 / 08';$('#location').textContent='FUNCHAL · PORTUGAL';$('#year').textContent='1997';return}
 if(game.phase==='ending'){ending();drawScene(7);$('#scene-eyebrow').textContent='CHAPTER 08 · YOUR LEGACY';$('#scene-title').textContent='The final whistle?';$('#scene-number').textContent='08 / 08';$('#location').textContent='RIYADH · SAUDI ARABIA';$('#year').textContent='2023';return}
 $('#scene-eyebrow').textContent=c.tag;$('#scene-title').textContent=c.title;$('#scene-number').textContent=`${String(game.chapter+1).padStart(2,'0')} / 08`;$('#location').textContent=c.place;$('#year').textContent=c.year;drawScene(game.chapter);
 if(game.phase==='choice')choiceScreen(c);else if(game.phase==='match')matchScreen(c);
}
function intro(){ $('#content').innerHTML=`<div class="dialogue"><div class="portrait">CR7</div><div><div class="speaker">THE STORYTELLER</div><div class="dialogue-text">Lisbon to Manchester. Madrid to Riyadh. The career is real. The choices—and the what-ifs—are yours. Shape the player, chase the moments, write your own ending.</div></div></div><div class="choices"><button class="choice" id="start"><span class="choice-key">↵</span><span class="choice-copy">START CAREER <span class="choice-hint">8 CHAPTERS · YOUR LEGACY</span></span></button></div>`;$('#start').onclick=()=>{game=structuredClone(initial);game.phase='choice';game.saved=false;save();render()}}
function choiceScreen(c){$('#content').innerHTML=`<div class="dialogue"><div class="portrait">${c.speaker.slice(0,2)}</div><div><div class="speaker">${c.speaker}</div><div class="dialogue-text">${c.text}</div></div></div><div class="choices">${c.choices.map((x,i)=>`<button class="choice" data-choice="${i}"><span class="choice-key">${i+1}</span><span class="choice-copy">${x[0]} <span class="choice-hint">${x[3]}</span></span></button>`).join('')}</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice))}
function choose(i){const c=chapters[game.chapter],opt=c.choices[i];game.stats[opt[1]]=clamp(game.stats[opt[1]]+opt[2]);game.decisions.push({chapter:game.chapter,choice:i});if(c.match){game.phase='match';game.shot=0;game.shotGoals=0;needle=0;dir=1}else next();save();render()}
function next(){game.chapter++;if(game.chapter>=chapters.length)game.phase='ending';else game.phase='choice'}
function matchScreen(c){$('#content').innerHTML=`<div class="matchbox"><div class="matchtop"><span>THE MOMENT <b>· ${c.club}</b></span><span id="shotcount">SHOT 1 / 3</span></div><div class="matchinstr" id="matchinstr">Time your strike. Stop the marker in the bright zone!</div><div class="meter" id="meter"><div class="sweetspot"></div><div class="needle" id="needle"></div></div><button class="shoot" id="shoot">⚽ &nbsp; SHOOT — TAP OR SPACE</button><div class="matchresult" id="matchresult">3 shots · make your moment count</div></div>`;$('#shoot').onclick=shoot;if(anim)cancelAnimationFrame(anim);animateNeedle()}
function animateNeedle(){if(game.phase!=='match')return;needle+=dir*1.35;if(needle>97){needle=97;dir=-1}if(needle<0){needle=0;dir=1}const el=$('#needle');if(el)el.style.left=needle+'%';anim=requestAnimationFrame(animateNeedle)}
function shoot(){if(game.phase!=='match')return;const accuracy=Math.abs(needle-50),goal=accuracy<13;game.shot++;if(goal){game.shotGoals++;game.stats.legacy=clamp(game.stats.legacy+3);$('#matchresult').textContent='GOAL! The net ripples. The crowd erupts!';beep(680)}else{$('#matchresult').textContent=accuracy<27?'SO CLOSE! The keeper gets fingertips to it.':'SAVED! The keeper read the shot.';beep(220)}$('#matchresult').style.color=goal?'var(--lime)':'var(--orange)';$('#shotcount').textContent=game.shot<3?`SHOT ${game.shot+1} / 3`:'FULL TIME';$('#shoot').disabled=true;$('#shoot').textContent=game.shot<3?'NEXT BALL →':'CONTINUE →';save();setTimeout(()=>{if(game.phase!=='match')return;if(game.shot>=3){game.stats.legacy=clamp(game.stats.legacy+game.shotGoals*2);game.phase='choice';game.chapter++;if(game.chapter>=chapters.length)game.phase='ending';save();render()}else{$('#shoot').disabled=false;$('#shoot').textContent='⚽  SHOOT — TAP OR SPACE';$('#matchresult').textContent=`${game.shotGoals} GOAL${game.shotGoals===1?'':'S'} · ${3-game.shot} SHOT${game.shot===2?'':'S'} LEFT`;$('#shotcount').textContent=`SHOT ${game.shot+1} / 3`;needle=0;dir=1}},850)}
function ending(){const s=game.stats,top=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];let title,copy;if(top==='loyalty'){title='The captain';copy='The shirt changes, the teammates change, but your heart never leaves the team. From Madeira to the world, your greatest legacy is the people you lifted along the way.'}else if(top==='craft'){title='The artist';copy='A career built on relentless reinvention. Every touch, every run, every leap tells the story of a player who made the impossible look practiced.'}else if(top==='aura'){title='The phenomenon';copy='You made every stadium feel smaller and every moment feel yours. The lights followed you from Lisbon to every corner of the footballing world.'}else{title='The immortal';copy='You kept asking for one more moment—and delivered. The records are written in ink; the what-ifs are written in the hearts of everyone who watched.'}$('#content').innerHTML=`<div class="ending"><div class="eyebrow">YOUR STORY. YOUR LEGACY.</div><h2>${title}</h2><div class="score">${game.goals+game.shotGoals} CAREER GOALS · ${game.decisions.length} DECISIONS · ${game.shotGoals} MATCH MOMENTS</div><p>${copy} This is only one version of the story. What would you change next time?</p><button class="restart" id="restart">↺ PLAY A NEW CAREER</button></div>`;$('#restart').onclick=reset}
function updateSide(){const s=game.stats;$('#stats').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="statrow"><span>${v.toUpperCase()}</span><div class="statbar"><div class="statfill" style="width:${s[k]}%"></div></div><span class="statnum">${s[k]}</span></div>`).join('');const top=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];$('#rank').textContent=game.phase==='ending'?({craft:'PLAYMAKER',aura:'ICON',loyalty:'CAPTAIN',legacy:'LEGEND'}[top]):game.chapter>=5?'SUPERSTAR':game.chapter>=2?'RISING STAR':'ROOKIE';$('#timeline').innerHTML=chapters.map((c,i)=>`<div class="timeline-item ${i<game.chapter?'done':i===game.chapter&&game.phase!=='ending'?'active':''}"><span class="dot"></span><span>${c.club==='MANCHESTER UNITED'?'MAN U':c.club==='SPORTING CP'?'SPORTING':c.club==='REAL MADRID'?'REAL':c.club==='PORTUGAL'?'PORTUGAL':c.club==='AL NASSR'?'AL NASSR':c.club==='MADEIRA'?'MADEIRA':c.club}</span></div>`).join('')}
function reset(){if(confirm('Start a new career? Your current story will be replaced.')){localStorage.removeItem('extra-time-save');game=structuredClone(initial);selected=0;render()}}
$('#reset-btn').onclick=reset;$('#sound-btn').onclick=()=>{sound=!sound;$('#sound-btn').textContent=`♪ SOUND: ${sound?'ON':'OFF'}`};
function beep(freq){if(!sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch{}}
document.addEventListener('keydown',e=>{if(e.key===' '){if(game.phase==='match'){e.preventDefault();shoot()}return}if(game.phase==='choice'){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=selected?0:1;document.querySelectorAll('.choice').forEach((b,i)=>b.style.borderColor=i===selected?'var(--lime)':'');}if(e.key==='Enter'||e.key==='1'||e.key==='2'){const i=e.key==='2'?1:e.key==='1'?0:selected;choose(i)}}else if(game.phase==='intro'&&e.key==='Enter')$('#start')?.click()});
// Pixel-art scenes: each backdrop is assembled from chunky canvas shapes.
function drawScene(n){const cv=$('#art'),x=cv.getContext('2d');x.imageSmoothingEnabled=false;const palettes=[['#95c9c4','#438080','#e7c77b'],['#aacfd1','#638f98','#d6bb73'],['#88bdd0','#396887','#c7aa72'],['#a8c7d5','#71838e','#b7a56f'],['#83bbd7','#3a6690','#d3c080'],['#90c7dc','#36698e','#cbb276'],['#8fc3d0','#4a7c91','#e1bf74'],['#edb985','#6c8c79','#dcbf78']];const [sky,stand,grass]=palettes[n];x.fillStyle=sky;x.fillRect(0,0,320,170);x.fillStyle='#f8eab0';x.fillRect(260,16,15,15); // sun
 if(n===0){x.fillStyle='#46818a';x.fillRect(0,90,320,30);x.fillStyle='#397277';for(let i=0;i<8;i++){x.fillRect(i*43,82+(i%3)*8,42,37)}x.fillStyle='#d5bc8a';x.fillRect(0,115,320,55);x.fillStyle='#8c7557';x.fillRect(0,143,320,27)}
 else {x.fillStyle='#17282e';x.fillRect(23,38,274,76);x.fillStyle=stand;x.fillRect(27,42,266,63);for(let r=0;r<4;r++){x.fillStyle=r%2?'#728b8a':'#d28b72';for(let i=0;i<28;i++)x.fillRect(33+i*9,48+r*12,5,5)}x.fillStyle='#243b36';x.fillRect(0,105,320,65);x.fillStyle=grass;x.fillRect(0,115,320,55);x.fillStyle='#dbe4c4';x.fillRect(0,116,320,2);x.fillRect(20,143,280,1);x.fillRect(20,116,2,54);x.fillRect(298,116,2,54);x.strokeStyle='#e3e5c7';x.lineWidth=1;x.beginPath();x.arc(160,145,22,Math.PI,0);x.stroke();x.fillStyle='#e2e4c4';x.fillRect(45,133,2,23);x.fillRect(45,133,35,2);x.fillRect(80,133,2,23);x.fillRect(240,133,35,2);x.fillRect(275,133,2,23)}
 // field texture
 for(let i=0;i<15;i++){x.fillStyle=i%2?'#ffffff0b':'#132d2910';x.fillRect(i*23,115,12,55)}
 // distant figures
 for(let i=0;i<14;i++){const px=22+i*21,py=78+(i%3)*7;x.fillStyle=i%3?'#e4d7b6':'#cc8165';x.fillRect(px,py,4,7);x.fillStyle='#25373a';x.fillRect(px,py+7,4,7)}
 // Cristiano sprite
 const px=n===0?135:145,py=n===0?118:112,shirt=n<2?'#b9343b':n===6?'#cf2936':n===7?'#e4d9c0':'#f1eee0';x.fillStyle='#e8b88b';x.fillRect(px+5,py,8,8);x.fillStyle='#342c29';x.fillRect(px+5,py-2,8,4);x.fillStyle=shirt;x.fillRect(px+3,py+8,12,17);x.fillStyle=n===2||n===4||n===5?'#18252d':'#f3f0dd';x.fillRect(px+3,py+24,5,10);x.fillRect(px+10,py+24,5,10);x.fillStyle='#252c2c';x.fillRect(px+1,py+33,7,3);x.fillRect(px+10,py+33,7,3);x.fillStyle='#d8f36a';x.fillRect(px+7,py+12,4,6);
 // ball and kick line
 x.fillStyle='#f5f0d7';x.fillRect(190,148,7,7);x.fillStyle='#303c38';x.fillRect(192,148,3,3);
 if(n===0){x.fillStyle='#533f36';x.fillRect(86,111,12,26);x.fillStyle='#d3a47e';x.fillRect(88,105,8,8);x.fillStyle='#e3dfd1';x.fillRect(88,119,8,17)}
}
render();
